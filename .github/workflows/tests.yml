name: tests

# axiscope 的 CI 只做一件能被机器复检的事：403 项测试当日实跑全绿。
# runner 与开发环境一致（windows-latest）——换平台跑等于换被测环境。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 环境自述
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      # **依赖必须先装。** 这条曾长期红着，而且红了两层：
      #   一、pytest 根本没装 → runner 上直接 "No module named pytest"；
      #   二、pytest 装了但数值栈没装 → 12 个测试模块在收集期就 ModuleNotFoundError。
      # 依赖登记在 KB0（docs/kb/KB0-conventions.md:130）：Python ≥ 3.11，
      # `numpy` + `scipy.signal` 为唯一数值依赖；matplotlib/pandas 本仓 0 处 import。
      #
      # **为什么钉死版本**：CI 要验的是「实测过的那套版本」，不是「今天能装上的最新版」。
      # 版本一浮，CI 可能因为一次无关的依赖发布而红，且仓里看不出原因——
      # 这正是本仓第 9 章说的那种"没人能解释的红"。改动版本号是一次**需要被看见的动作**。
      # 三个版本即本地实测通过的那一套（numpy 2.5.3 / scipy 1.18.1 / pytest 9.1.1，Python 3.14.9）。
      # 各测试文件自己把 src/ 插进 sys.path，故无需 pip install -e .。
      - name: 安装测试依赖（pytest + 唯一数值栈，版本钉死）
        run: python -m pip install --upgrade "pytest==9.1.1" "numpy==2.5.3" "scipy==1.18.1"

      - name: 依赖版本自述
        run: python -c "import numpy, scipy, pytest; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| pytest', pytest.__version__)"

      - name: pytest 全量
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: 脱敏自检（发布前必做：三个标识值 token 归零）
        env:
          PYTHONIOENCODING: utf-8
        run: python data/probe_pii.py
