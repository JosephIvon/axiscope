name: tests

# axiscope 的 CI 只做一件能被机器复检的事：403 项测试当日实跑全绿。
# runner 与开发环境一致（windows-latest）——换平台跑等于换被测环境。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 环境自述
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: pytest 全量
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: 脱敏自检（发布前必做：三个标识值 token 归零）
        run: python data/probe_pii.py

  book:
    # 书卷门禁：坐标、结构、裁剪、数字、脱敏、断链——六道，全绿才算书写完了。
    #
    # **fetch-depth: 0 是硬要求**：坐标审计按**锚点 commit**（axiscope@0bf4ad4）
    # 读源文件（git show <rev>:<path>）。浅克隆里没有那个 commit，
    # 审计会读不到文件——而读不到文件的那一档必须判失败，不能当"通过"。
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 环境自述
        run: |
          python --version
          git rev-parse --short HEAD

      - name: 坐标审计（每处引用解析回源文件 + 行锚断言）
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/audit_coords.py

      - name: 结构体检（逐章必备件 + 锚点串一致性）
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/check_book_structure.py

      - name: 裁剪件逐字核对
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/verify_crops_verbatim.py

      - name: 书中数字核对
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/verify_book_numbers.py

      - name: 脱敏与绝对路径扫描
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/scan_absolute_paths.py

      - name: 断链检查
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/check_broken_links.py
