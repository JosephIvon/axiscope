name: tests

# axiscope 的 CI 只做一件能被机器复检的事：403 项测试当日实跑全绿。
# runner 与开发环境一致（windows-latest）——换平台跑等于换被测环境。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 环境自述
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: pytest 全量
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: 脱敏自检（发布前必做：三个标识值 token 归零）
        run: python data/probe_pii.py
